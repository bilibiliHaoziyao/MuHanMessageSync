name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(cat <<'EOF'
          ## 慕寒消息云同步 ${{ github.ref_name }}

          - 🎉 正式版 1.0.0
          - 🏠 首页改为同步历史（带应用图标、收发方向、来源设备）
          - 📦 应用图标随通知传输，接收端跨设备还原带图标的通知
          - ⚙️ 原主界面迁入「设置 → 邮箱服务器设置」，新增「同步选项」自定义
          - 🌊 适配沉浸式状态栏与全面屏手势小白条
          - ⚡ QQ邮箱 / 163邮箱 / Gmail / Outlook 快速预设
          - 🧭 首次进入引导：开启通知使用权与后台保活
          - 已使用 release 签名

          详见 README。
          EOF
          )
          gh release create "${{ github.ref_name }}" \
            --title "慕寒消息云同步 ${{ github.ref_name }}" \
            --notes "$NOTES" \
            "app/build/outputs/apk/release/app-release.apk#慕寒消息云同步-${{ github.ref_name }}.apk"
