name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(cat <<'EOF'
          ## 慕寒消息云同步 ${{ github.ref_name }}

          - 🎨 全新软件图标（云同步主题）
          - ⚡ 新增 QQ邮箱 / 163邮箱 / Gmail / Outlook 快速预设
          - 🧭 首次进入引导：开启通知使用权与后台保活
          - 服务端模式：监听系统所有通知，通过 SMTP 邮件实时转发
          - 接收端模式：IMAP 实时收信（IDLE），还原为系统通知
          - 支持多设备：多收件人 + 多接收端共用邮箱去重
          - 已使用 release 签名

          详见 README。
          EOF
          )
          gh release create "${{ github.ref_name }}" \
            --title "慕寒消息云同步 ${{ github.ref_name }}" \
            --notes "$NOTES" \
            "app/build/outputs/apk/release/app-release.apk#慕寒消息云同步-${{ github.ref_name }}.apk"
