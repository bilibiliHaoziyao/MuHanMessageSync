name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "慕寒消息云同步 ${GITHUB_REF_NAME}" \
            --notes "## 慕寒消息云同步 ${GITHUB_REF_NAME}

- 服务端模式：监听系统所有通知，通过 SMTP 邮件实时转发
- 接收端模式：IMAP 实时收信（IDLE），还原为系统通知
- 支持多设备：多收件人 + 多接收端共用邮箱去重
- 已使用 release 签名

详见 [README](https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md)。" \
            app/build/outputs/apk/release/app-release.apk#"慕寒消息云同步-${GITHUB_REF_NAME}.apk"
