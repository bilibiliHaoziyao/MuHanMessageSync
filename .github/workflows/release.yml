name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(cat <<'EOF'
          ## 慕寒消息云同步 ${{ github.ref_name }}

          - 🚀 版本 1.1.0
          - 🔍 历史页新增搜索、收发方向筛选、今日/累计统计
          - 📋 历史条目点击复制内容，长按删除单条
          - 📲 接收端通知点击直达来源应用
          - 🐛 修复：设备名随机变动、历史存储性能隐患、图标处理阻塞主线程、状态通知刷屏、停止服务失效、开机自启选项无效、选项页重复重建
          - ⚙️ 新增选项：合并重复内容、历史保留天数
          - 已使用 release 签名

          详见 README。
          EOF
          )
          gh release create "${{ github.ref_name }}" \
            --title "慕寒消息云同步 ${{ github.ref_name }}" \
            --notes "$NOTES" \
            "app/build/outputs/apk/release/app-release.apk#慕寒消息云同步-${{ github.ref_name }}.apk"
